<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" viewBox="0 0 641 388"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="s1"><g transform="translate(0.5,0.5)"><rect x="60" y="0" width="300" height="40" rx="4" ry="4" fill="none" stroke="var(--accent-ink-blue)" pointer-events="all"/></g><g><g fill="var(--accent-ink-blue)" font-family="Helvetica" text-anchor="middle" font-size="12px"><text x="210" y="25">Loxone: setpoint dragged from 18 to 24</text></g></g></g><g data-cell-id="a1"><g><rect x="380" y="10" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-ink-blue)" font-family="Helvetica" text-anchor="start" font-size="10px"><text x="382" y="26">12 separate HTTP requests</text></g></g></g><g data-cell-id="e1"><g transform="translate(0.5,0.5)"><path d="M 210 40 L 210 69.88" fill="none" stroke="currentColor" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 210 76.88 L 206.5 69.88 L 213.5 69.88 Z" fill="currentColor" stroke="currentColor" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="s2"><g transform="translate(0.5,0.5)"><rect x="60" y="78" width="300" height="40" rx="4" ry="4" fill="none" stroke="var(--accent-ink-green)" pointer-events="all"/></g><g><g fill="var(--accent-ink-green)" font-family="Helvetica" text-anchor="middle" font-size="12px"><text x="210" y="103">cache.apply() - state overwritten at once</text></g></g></g><g data-cell-id="a2"><g><rect x="380" y="88" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-ink-green)" font-family="Helvetica" text-anchor="start" font-size="10px"><text x="382" y="104">The UI shows 24 - no cloud, no waiting</text></g></g></g><g data-cell-id="e2"><g transform="translate(0.5,0.5)"><path d="M 210 118 L 210 147.88" fill="none" stroke="currentColor" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 210 154.88 L 206.5 147.88 L 213.5 147.88 Z" fill="currentColor" stroke="currentColor" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="s3"><g transform="translate(0.5,0.5)"><rect x="60" y="156" width="300" height="40" rx="4" ry="4" fill="none" stroke="currentColor" stroke-dasharray="6 4" pointer-events="all"/></g><g><g fill="currentColor" font-family="Helvetica" text-anchor="middle" font-size="12px"><text x="210" y="181">Debounce, 3 seconds</text></g></g></g><g data-cell-id="a3"><g><rect x="380" y="166" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="currentColor" font-family="Helvetica" text-anchor="start" font-size="10px"><text x="382" y="182">Each new value discards the previous timer</text></g></g></g><g data-cell-id="e3"><g transform="translate(0.5,0.5)"><path d="M 210 196 L 210 225.88" fill="none" stroke="currentColor" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 210 232.88 L 206.5 225.88 L 213.5 225.88 Z" fill="currentColor" stroke="currentColor" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="s4"><g transform="translate(0.5,0.5)"><rect x="60" y="234" width="300" height="40" rx="4" ry="4" fill="none" stroke="var(--accent-ink-yellow)" pointer-events="all"/></g><g><g fill="var(--accent-ink-yellow)" font-family="Helvetica" text-anchor="middle" font-size="12px"><text x="210" y="259">api.patch() - exactly one PATCH</text></g></g></g><g data-cell-id="a4"><g><rect x="380" y="244" width="220" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-ink-yellow)" font-family="Helvetica" text-anchor="start" font-size="10px"><text x="382" y="260">1 call instead of 12</text></g></g></g><g data-cell-id="e4"><g transform="translate(0.5,0.5)"><path d="M 210 274 L 210 303.88" fill="none" stroke="currentColor" stroke-miterlimit="10" pointer-events="stroke"/><path d="M 210 310.88 L 206.5 303.88 L 213.5 303.88 Z" fill="currentColor" stroke="currentColor" stroke-miterlimit="10" pointer-events="all"/></g></g><g data-cell-id="s5"><g transform="translate(0.5,0.5)"><rect x="60" y="312" width="300" height="40" rx="4" ry="4" fill="none" stroke="var(--accent-ink-yellow)" pointer-events="all"/></g><g><g fill="var(--accent-ink-yellow)" font-family="Helvetica" text-anchor="middle" font-size="12px"><text x="210" y="337">poller.refreshSoon() after 90 seconds</text></g></g></g><g data-cell-id="a5"><g><rect x="380" y="322" width="260" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="var(--accent-ink-yellow)" font-family="Helvetica" text-anchor="start" font-size="10px"><text x="382" y="338">The cloud confirms, the cache is corrected</text></g></g></g><g data-cell-id="fehler"><g><rect x="0" y="366" width="420" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="currentColor" font-family="Helvetica" text-anchor="middle" font-size="10px"><text x="210" y="382">If the PATCH fails, an immediate poll restores the truth.</text></g></g></g></g></g></g></svg>
